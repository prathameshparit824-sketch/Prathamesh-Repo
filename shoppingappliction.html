

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Shopping App</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .product .emoji {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .product h3 {
            margin-bottom: 10px;
        }

        .price {
            color: #e63946;
            font-weight: bold;
            margin-bottom: 15px;
        }

        button {
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            background: #007bff;
            color: white;
        }

        button:hover {
            background: #0056b3;
        }

        .cart {
            background: white;
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .cart h2 {
            margin-bottom: 15px;
        }

        #cart-items {
            list-style: none;
        }

        #cart-items li {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        .checkout {
            display: block;
            margin: 15px 0 0 auto;
            background: #28a745;
        }

        .checkout:hover {
            background: #218838;
        }
    </style>
</head>

<body>

    <header>
        <h1>🛒 Mini Shopping App</h1>
        <p>Simple online store</p>
    </header>

    <div class="container">

        <h2>Products</h2>

        <br>

        <div class="products">

            <div class="product">
                <div class="emoji">👕</div>
                <h3>T-Shirt</h3>
                <p class="price">₹499</p>
                <button onclick="addToCart('T-Shirt', 499)">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <div class="emoji">👟</div>
                <h3>Shoes</h3>
                <p class="price">₹1,499</p>
                <button onclick="addToCart('Shoes', 1499)">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <div class="emoji">🎧</div>
                <h3>Headphones</h3>
                <p class="price">₹999</p>
                <button onclick="addToCart('Headphones', 999)">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <div class="emoji">⌚</div>
                <h3>Smart Watch</h3>
                <p class="price">₹2,499</p>
                <button onclick="addToCart('Smart Watch', 2499)">
                    Add to Cart
                </button>
            </div>

        </div>

        <div class="cart">
            <h2>🛍️ Shopping Cart</h2>

            <ul id="cart-items">
                <li>Your cart is empty.</li>
            </ul>

            <div class="total">
                Total: ₹<span id="total">0</span>
            </div>

            <button class="checkout" onclick="checkout()">
                Checkout
            </button>
        </div>

    </div>

    <script>
        let cart = [];
        let total = 0;

        function addToCart(name, price) {
            cart.push({
                name: name,
                price: price
            });

            total += price;

            updateCart();
        }

        function updateCart() {
            const cartItems = document.getElementById("cart-items");
            const totalElement = document.getElementById("total");

            cartItems.innerHTML = "";

            if (cart.length === 0) {
                cartItems.innerHTML = "<li>Your cart is empty.</li>";
                return;
            }

            cart.forEach((item, index) => {
                const li = document.createElement("li");

                li.innerHTML = `
                    <span>${item.name} - ₹${item.price}</span>
                    <button onclick="removeFromCart(${index})">
                        Remove
                    </button>
                `;

                cartItems.appendChild(li);
            });

            totalElement.textContent = total;
        }

        function removeFromCart(index) {
            total -= cart[index].price;
            cart.splice(index, 1);

            updateCart();
        }

        function checkout() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            alert("Order placed successfully! 🎉");

            cart = [];
            total = 0;

            updateCart();
            document.getElementById("total").textContent = "0";
        }
    </script>

</body>
</html>
